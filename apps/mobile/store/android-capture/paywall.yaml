# Opens the paywall (Settings > Plan) by deep link and waits for the store's answer.
appId: com.aplayermode.app
---
- openLink: aplayermode://settings/plan
- extendedWaitUntil:
    visible: "Executive Roundtable"
    timeout: 60000
# The store side settles (Play prices, or the outage card) within STORE_ANSWER_MS (15 s): never stuck loading.
- extendedWaitUntil:
    notVisible: "Getting prices from the store…"
    timeout: 30000
