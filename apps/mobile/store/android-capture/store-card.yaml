# Scrolls up to the store-status card shown above the tiers when the store side did not load, and
# centres it so its whole message is in the screenshot (absent when Play prices loaded: optional).
appId: com.aplayermode.app
---
- scrollUntilVisible:
    element: ".*Nothing was charged and your setup is saved.*"
    direction: UP
    centerElement: true
    timeout: 15000
    optional: true
