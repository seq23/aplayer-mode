name: Deploy Cloudflare API

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment label
        required: true
        default: production
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: cloudflare-api-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Require Cloudflare deployment credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "CLOUDFLARE_API_TOKEN is not configured" && exit 2)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "CLOUDFLARE_ACCOUNT_ID is not configured" && exit 2)
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Validate source
        run: npm run typecheck
      - name: Deploy API
        run: npm run api:deploy
      - name: Record immutable source
        run: echo "Deployed commit ${GITHUB_SHA} to ${{ inputs.environment }}"
