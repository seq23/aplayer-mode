name: Weekly Outcome Report

# "Is the site work helping?" answered once a week, per host, week over week
# (Search Readiness Checklist i9). Wednesdays 07:13 America/Chicago (owner's
# rebalanced week, 1 Nov 2026): two UTC crons (12:13 in CDT, 13:13 in CST) and a
# guard step that lets only the one matching Chicago's current offset run.
#
# Report -> committed reports/outcomes/<ISO-week>.{md,json} -> one self-closing
# issue per red host (opened, updated while red, commented and closed when the
# host comes back green) -> spry-weekly-summary.json, uploaded as the artifact
# `spry-weekly-summary`.
#
# NO EMAIL FROM HERE (1 Nov 2026). Boss OS reads that artifact at 08:15 Central
# and sends the ONE "Spry Labs weekly" email, a short section per business. A
# week this does not run, that email says so in a plain line. This workflow
# deploys nothing.
on:
  schedule:
    - cron: "13 12 * * 3"
    - cron: "13 13 * * 3"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: weekly-outcome-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Guard Wednesday 07:13 Chicago
        id: guard
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          offset=$(TZ=America/Chicago date +%z)
          run=true
          if [ "$SCHEDULE" = "13 12 * * 3" ] && [ "$offset" != "-0500" ]; then run=false; fi
          if [ "$SCHEDULE" = "13 13 * * 3" ] && [ "$offset" != "-0600" ]; then run=false; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "schedule='${SCHEDULE:-dispatch}' chicago_offset=$offset run=$run"

      - uses: actions/checkout@v4
        if: steps.guard.outputs.run == 'true'

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.run == 'true'
        with:
          node-version: '22.13.0'

      - name: Self-check the reporter before trusting it
        if: steps.guard.outputs.run == 'true'
        run: |
          node scripts/weekly-outcome-report.mjs --self-check
          node scripts/weekly-outcome-issues.mjs --self-check
          node .github/scripts/spry-weekly-summary.mjs --self-check

      - name: Measure every host and write the report
        id: measure
        if: steps.guard.outputs.run == 'true'
        run: node scripts/weekly-outcome-report.mjs

      - name: Commit the report
        if: steps.guard.outputs.run == 'true'
        env:
          WEEK: ${{ steps.measure.outputs.week }}
          SUMMARY: ${{ steps.measure.outputs.summary }}
        run: |
          test -f "reports/outcomes/${WEEK}.json" || { echo "NAMED STOP: the reporter wrote no report for ${WEEK}"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/outcomes
          if git diff --cached --quiet; then
            echo "Report for ${WEEK} is unchanged; nothing to commit."
          else
            git commit -m "Weekly outcome report ${WEEK}: ${SUMMARY}"
            git push
          fi

      - name: One self-closing issue per red host
        if: steps.guard.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/weekly-outcome-issues.mjs "reports/outcomes/${{ steps.measure.outputs.week }}.json"

      - name: Hand the week to Boss OS (the Spry Labs weekly email)
        if: steps.guard.outputs.run == 'true'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/spry-weekly-summary.mjs "reports/outcomes/${{ steps.measure.outputs.week }}.json" spry-weekly-summary.json

      - name: Upload the summary for Boss OS
        if: steps.guard.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: spry-weekly-summary
          path: spry-weekly-summary.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload the report
        if: always() && steps.guard.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: weekly-outcome-report-${{ github.run_id }}
          path: reports/outcomes
          if-no-files-found: warn
          retention-days: 90
