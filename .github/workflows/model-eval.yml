name: Model Eval

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'screen (public synthetic screen) or coaching_v1 (coaching promotion evidence, docs/23)'
        required: false
        default: screen
        type: choice
        options: [screen, coaching_v1]

permissions:
  contents: read

jobs:
  evaluate-free-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Require evaluation secret
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: test -n "$OPENROUTER_API_KEY" || (echo "OPENROUTER_API_KEY is not configured" && exit 2)
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Validate exact source
        run: npm run typecheck && npm run test
      - name: Run public synthetic benchmark
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          APM_COMMIT_SHA: ${{ github.sha }}
          APM_EVAL_SUITE: ${{ inputs.suite }}
        run: node scripts/evaluate-openrouter-routes.mjs > openrouter-eval-report.json
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openrouter-eval-report-${{ github.sha }}
          path: openrouter-eval-report.json
          if-no-files-found: warn
          retention-days: 30
