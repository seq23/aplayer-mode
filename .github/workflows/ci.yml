name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Typecheck workspaces
        run: npm run typecheck

      - name: Test workspaces
        run: npm run test

      - name: App Store pre-submit check (no placeholders, no Stripe, links via openExternal, iPad decision)
        run: npm run presubmit:ios

      - name: Cost posture ("nothing paid", docs/cost/zero-paid-llm.md)
        run: npm run validate:cost

      - name: Workflow pushes rebase and retry (a bare git push fails when main moves)
        run: npm run validate:workflow-push

      - name: Weekly outcome report self-check (reporter and its self-closing issues)
        run: npm run validate:outcomes

      - name: Play store checks prove their verdicts on fixtures (track placement, plans vs policy)
        run: node scripts/play-internal-check.mjs --self-check && node scripts/play-billing-check.mjs --self-check && node scripts/lib/play-auth.mjs --self-check && node scripts/android-capture-verdict.mjs --self-check

      - name: Bundle the app (Metro must resolve workspace sources)
        run: npx expo export --platform web --output-dir "$RUNNER_TEMP/web-export"
        working-directory: apps/mobile
